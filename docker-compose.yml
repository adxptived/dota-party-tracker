services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/mmrbot.db
    volumes:
      - bot_data:/data
    security_opt:
      - no-new-privileges:true  # процесс бота (uid 10001) не может вернуть себе права root
    logging:
      driver: json-file
      options:
        max-size: "10m"  # иначе лог контейнера растёт без предела
        max-file: "3"

volumes:
  bot_data:
